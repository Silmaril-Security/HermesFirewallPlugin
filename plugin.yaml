manifest_version: 1
name: hermes-firewall
version: 0.5.1
license: Apache-2.0
description: Fail-open Silmaril SDK firewall hooks for Hermes with readable opt-in enforcement.
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - transform_llm_output
  - subagent_start
  - subagent_stop
requires_env:
  - name: SILMARIL_API_KEY
    description: API key for the Silmaril Firewall classify API.
    secret: true
  - name: SILMARIL_API_URL
    description: Tenant /classify endpoint for the Silmaril Firewall API.
optional_env:
  - name: HERMES_FIREWALL_BLOCK_MALICIOUS
    description: Set true to block malicious content at supported pre-tool and transform boundaries.
  - name: HERMES_FIREWALL_SDK_TIMEOUT_SECONDS
    description: SDK request timeout in seconds. Defaults to 2.0.
  - name: HERMES_FIREWALL_SDK_MAX_RETRIES
    description: SDK retry count. Defaults to 0.
  - name: HERMES_FIREWALL_MAX_PAYLOAD_CHARS
    description: Maximum classified payload length. Defaults to 8000 characters.
  - name: SILMARIL_LOCAL_EVENT_DIR
    description: Direct override for the private LocalProtectionEventV1 incoming directory.
